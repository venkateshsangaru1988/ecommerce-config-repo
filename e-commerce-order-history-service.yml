server:
  port: 2004
  servlet:
    context-path: /e-commerce-order-history

spring:
  application:
    name: e-commerce-order-history-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
