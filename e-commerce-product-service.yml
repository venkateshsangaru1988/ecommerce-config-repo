server:
  port: 2001
  servlet:
    context-path: /e-commerce-product

spring:
  application:
    name: e-commerce-product-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
