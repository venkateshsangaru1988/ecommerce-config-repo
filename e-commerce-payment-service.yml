server:
  port: 2003
  servlet:
    context-path: /e-commerce-payment

spring:
  application:
    name: e-commerce-payment-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
